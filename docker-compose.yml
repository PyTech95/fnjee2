name: fnjee

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?set MONGO_ROOT_USER in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    # no "ports:" on purpose — Mongo is reachable only inside the docker network

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      MONGO_URL: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin
      ENABLE_INTERNAL_SCHEDULER: "true"
      MEDIA_DIR: /app/media
    volumes:
      - media_data:/app/media   # question pictures from imports (keep across rebuilds)
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        SITE_URL: https://${DOMAIN:?set DOMAIN in .env}
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy

  backup:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./deploy/backup-loop.sh:/backup-loop.sh:ro
      - media_data:/media:ro
    entrypoint: ["sh", "/backup-loop.sh"]
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  media_data:
  mongo_data:
  caddy_data:
  caddy_config:
